[project]
name = "langgraph-agent"
version = "0.1.0"
description = "A minimal LangGraph chatbot with a dev container"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai==1.7.0",
    "langgraph==1.2.14",
]

[project.scripts]
langgraph-agent = "langgraph_agent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
